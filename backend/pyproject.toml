[project]
name = "parity-backend"
version = "0.1.0"
description = "parity backend — real OpenAPI ingestion, Postgres persistence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "openapi-spec-validator>=0.7",
    "graphql-core>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["app*"]
